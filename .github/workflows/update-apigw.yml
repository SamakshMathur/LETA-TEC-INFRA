name: Update API Gateway IP

on:
  workflow_dispatch:
    inputs:
      task_ip:
        description: 'New ECS task public IP'
        required: true
        default: '13.207.199.136'

env:
  AWS_REGION: ap-south-1

jobs:
  update-apigw:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update API Gateway integrations
        run: |
          API_ID="swmgzifq69"
          NEW_IP="${{ github.event.inputs.task_ip }}"
          echo "Updating API Gateway $API_ID to IP $NEW_IP"

          INTEG_IDS=$(aws apigatewayv2 get-integrations \
            --api-id "$API_ID" \
            --query 'Items[?starts_with(IntegrationUri, `http`)].IntegrationId' \
            --output text)

          for INTEG_ID in $INTEG_IDS; do
            OLD_URI=$(aws apigatewayv2 get-integration \
              --api-id "$API_ID" --integration-id "$INTEG_ID" \
              --query 'IntegrationUri' --output text)
            NEW_URI=$(echo "$OLD_URI" | sed "s/[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}/$NEW_IP/g")
            aws apigatewayv2 update-integration \
              --api-id "$API_ID" \
              --integration-id "$INTEG_ID" \
              --integration-uri "$NEW_URI"
            echo "Updated: $OLD_URI → $NEW_URI"
          done

      - name: Smoke test
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://swmgzifq69.execute-api.ap-south-1.amazonaws.com/api/health" \
            --max-time 15)
          echo "Health check: $STATUS"
