name: CI

# Runs on every push and every PR — catches broken imports, syntax errors, and
# basic regression failures before they reach main or trigger a deploy.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Compile · Import · Lint · Test
    runs-on: ubuntu-latest

    env:
      # Minimal fake values so module-level config.py reads don't crash the
      # import check.  Nothing here reaches a real service — all connections
      # happen at request time, not at import time.
      ANTHROPIC_API_KEY: ci-placeholder
      MONGODB_URI: mongodb://localhost:27017/ci_test
      SECRET_KEY: ci-placeholder-32-char-secret!!
      REDIS_URL: redis://localhost:6379
      ADMIN_MASTER_SECRET: ci-placeholder
      FAST2SMS_API_KEY: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      RAZORPAY_KEY_ID: ci-placeholder
      RAZORPAY_KEY_SECRET: ci-placeholder
      RAZORPAY_WEBHOOK_SECRET: ci-placeholder
      DEV_MODE: "true"

    steps:
      - uses: actions/checkout@v4

      # ── Step 1: Syntax check — no deps required, runs in ~5s ───────────────
      # This alone would have caught both syntax regressions that shipped to prod
      # (prompt.py utc_now migration, control_center.py misplaced import).
      - name: Fast syntax check (no deps)
        run: python3 -m compileall -q rag-backend/app

      # ── Step 2: Install deps (cached) ───────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: rag-backend/requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r rag-backend/requirements-ci.txt

      # ── Step 3: Import check — catches broken imports, missing modules ───────
      # The app is imported but not started — startup event (DB connect, FAISS
      # load, model warmup) does NOT run, so no live services are needed.
      - name: Import check
        run: |
          cd rag-backend
          python -c "
          import sys; sys.path.insert(0, '.')
          from app.api.app import app
          print('✓ app.api.app imported cleanly')
          from app.routing.router import route_query
          print('✓ routing.router imported cleanly')
          from app.generation.context_builder import build_context, parse_markers
          print('✓ generation.context_builder imported cleanly')
          from app.generation.hallucination_guard import check_hallucinated_numbers
          print('✓ generation.hallucination_guard imported cleanly')
          from app.api.sessions import _coerce_session_doc
          print('✓ api.sessions imported cleanly')
          "

      # ── Step 4: Lint — runtime-breaking rules only ───────────────────────────
      # E9xx = syntax, F821 = undefined name, F811 = redefined (duplicate class),
      # W605 = invalid escape.  Not enforcing style rules (E1/E2/E5) yet — too
      # noisy on an existing codebase; add them incrementally.
      - name: Lint (runtime-breaking rules)
        run: |
          cd rag-backend
          ruff check app --select=E9,F821,F811,W605

      # ── Step 5: Tests ────────────────────────────────────────────────────────
      - name: Run tests
        run: |
          cd rag-backend
          pytest tests/ -v --tb=short
