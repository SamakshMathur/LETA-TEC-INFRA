name: Deploy to Staging

# Triggered manually or on push to the `staging` branch.
# The staging service runs 1 Fargate task (no HA) with DEV_MODE=true.
# Production is never touched by this workflow.
on:
  push:
    branches: [staging]
    paths:
      - 'rag-backend/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: gst-rag-backend
  ECS_CLUSTER: gst-rag-cluster
  ECS_SERVICE: gst-rag-backend-staging-service
  CONTAINER_NAME: gst-rag-backend

jobs:
  # ── CI gate ─────────────────────────────────────────────────────────────────
  ci-verify:
    name: Compile · Import · Lint · Test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ci-placeholder
      MONGODB_URI: mongodb://localhost:27017/ci_test
      SECRET_KEY: ci-placeholder-32-char-secret!!
      REDIS_URL: redis://localhost:6379
      ADMIN_MASTER_SECRET: ci-placeholder
      FAST2SMS_API_KEY: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      RAZORPAY_KEY_ID: ci-placeholder
      RAZORPAY_KEY_SECRET: ci-placeholder
      RAZORPAY_WEBHOOK_SECRET: ci-placeholder
      DEV_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Fast syntax check (no deps)
        run: python3 -m compileall -q rag-backend/app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: rag-backend/requirements-ci.txt
      - name: Install CI dependencies
        run: pip install -r rag-backend/requirements-ci.txt
      - name: Import check
        run: |
          cd rag-backend
          python -c "
          import sys; sys.path.insert(0, '.')
          from app.api.app import app
          from app.routing.router import route_query
          from app.generation.context_builder import build_context, parse_markers
          from app.generation.hallucination_guard import check_hallucinated_numbers
          from app.api.sessions import _coerce_session_doc
          print('✓ all critical modules imported cleanly')
          "
      - name: Lint (runtime-breaking rules)
        run: cd rag-backend && ruff check app --select=E9,F821,F811,W605
      - name: Run tests
        run: cd rag-backend && pytest tests/ -v --tb=short

  deploy-staging:
    name: Staging → ECR → ECS
    needs: ci-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR (staging tag)
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f rag-backend/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:staging-$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:staging-latest \
            rag-backend/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:staging-$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:staging-latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:staging-$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current staging task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition gst-rag-backend-staging \
            --query taskDefinition \
            > infra/task-def-staging-current.json

      - name: Sync non-secret env vars from staging template
        run: |
          python3 - << 'EOF'
          import json

          TEMPLATE_PATH = "rag-backend/.aws/task-definition-staging.json"
          LIVE_PATH     = "infra/task-def-staging-current.json"
          SECRET_KEYS   = {
              "ANTHROPIC_API_KEY", "MONGODB_URI", "SECRET_KEY",
              "ADMIN_MASTER_SECRET", "REDIS_URL", "FAST2SMS_API_KEY",
              "RESEND_API_KEY", "RAZORPAY_KEY_ID", "RAZORPAY_KEY_SECRET",
              "RAZORPAY_WEBHOOK_SECRET",
          }

          with open(TEMPLATE_PATH) as f:
              template = json.load(f)
          with open(LIVE_PATH) as f:
              live = json.load(f)

          tmpl_env = {e["name"]: e["value"]
                      for e in template["containerDefinitions"][0].get("environment", [])}

          for cd in live["containerDefinitions"]:
              live_env_map = {e["name"]: e["value"] for e in cd.get("environment", [])}
              ecs_secret_names = {s["name"] for s in cd.get("secrets", [])}
              for k, v in tmpl_env.items():
                  if k not in SECRET_KEYS and k not in ecs_secret_names:
                      live_env_map[k] = v
              cd["environment"] = [{"name": k, "value": v} for k, v in live_env_map.items()]

          with open(LIVE_PATH, "w") as f:
              json.dump(live, f, indent=2)
          print("Staging env vars synced.")
          EOF

      - name: Update image in staging task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-def-staging-current.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to staging ECS (1 task, no HA required)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test staging deployment
        run: |
          # Staging may not have a public ALB — health check via ECS exec or skip
          # If you have a staging ALB, replace this URL.
          STAGING_URL="${STAGING_HEALTH_URL:-}"
          if [[ -z "$STAGING_URL" ]]; then
            echo "No STAGING_HEALTH_URL set — skipping smoke test."
            echo "Set it as a repo secret to enable post-deploy verification."
            exit 0
          fi
          MAX_WAIT=120
          INTERVAL=15
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL" --max-time 20)
            echo "  [${ELAPSED}s] status=${HTTP_STATUS}"
            [ "$HTTP_STATUS" = "200" ] && echo "Staging health check passed." && exit 0
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "WARNING: staging health did not return 200 in ${MAX_WAIT}s (may still be warming up)"
          exit 0   # non-fatal for staging
        env:
          STAGING_HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
