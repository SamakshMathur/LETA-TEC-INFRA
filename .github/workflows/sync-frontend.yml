# sync-frontend.yml
#
# PURPOSE
# -------
# Whenever frontend/ changes are merged to LETRA-TEC-INFRA main, automatically
# mirror them into the outer GST-RAG- repo's frontend/ directory and push to
# its main branch — which triggers an Amplify rebuild.
#
# WHY THIS EXISTS
# ---------------
# Amplify is connected to SamakshMathur/GST-RAG- (the outer "shell" repo), not
# to LETRA-TEC-INFRA.  Without this workflow, every frontend change requires a
# manual copy step into the outer repo, creating the risk of the bordered-box
# LetaResponse incident (UI fix merged to LETRA-TEC-INFRA but never visible in
# production because Amplify never saw the change).
#
# SETUP (one-time, ~2 minutes)
# -------
# 1. Create a GitHub Personal Access Token (classic) with scope `repo`.
#    Settings → Developer settings → Personal access tokens → Tokens (classic)
#    → Generate new token → check "repo" → copy the token.
# 2. In LETRA-TEC-INFRA → Settings → Secrets and variables → Actions →
#    New repository secret → Name: GST_RAG_TOKEN, Value: <paste token>.
# That's it.  This workflow will fire on the next push to main that touches
# the frontend/ directory.

name: Sync frontend → GST-RAG-

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  sync:
    name: Mirror frontend to GST-RAG-
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LETRA-TEC-INFRA (source)
        uses: actions/checkout@v4
        with:
          path: letra-tec

      - name: Checkout GST-RAG- (destination)
        uses: actions/checkout@v4
        with:
          repository: SamakshMathur/GST-RAG-
          token: ${{ secrets.GST_RAG_TOKEN }}
          ref: main
          # Skip LFS objects — we only touch JS/JSX source files, not the
          # 127 MB chunks.jsonl that lives in LFS.
          lfs: false
          path: gst-rag

      - name: Sync frontend files
        run: |
          # rsync everything from LETRA-TEC-INFRA/frontend/ into GST-RAG-/frontend/
          # --delete removes files from the destination that no longer exist in
          # the source, keeping both directories in lock-step.
          rsync -av --delete \
            letra-tec/frontend/ \
            gst-rag/frontend/

      - name: Commit and push if changed
        working-directory: gst-rag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add frontend/

          # Only commit if there is actually a diff — avoids empty commits on
          # pushes that touch other files alongside frontend/ changes.
          if git diff --staged --quiet; then
            echo "No frontend changes to sync — skipping commit."
            exit 0
          fi

          SOURCE_SHA=$(git -C ../letra-tec rev-parse --short HEAD)
          git commit -m "sync: frontend from LETRA-TEC-INFRA@${SOURCE_SHA}

Auto-synced by sync-frontend.yml — do not edit frontend/ in GST-RAG- directly;
all changes must go through LETRA-TEC-INFRA and will be mirrored here on merge."

          git push origin main
          echo "✅ Synced and pushed — Amplify rebuild triggered."
