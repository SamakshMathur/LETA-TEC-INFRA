name: Deploy Backend to AWS

on:
  push:
    branches: [main]
    paths:
      - 'rag-backend/**'
      - 'infra/ecs-task-definition.json'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: gst-rag-backend
  ECS_CLUSTER: gst-rag-cluster
  ECS_SERVICE: gst-rag-backend-service
  CONTAINER_NAME: gst-rag-backend

jobs:
  deploy-backend:
    name: Backend → ECR → ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f rag-backend/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            rag-backend/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition gst-rag-backend \
            --query taskDefinition \
            > infra/task-def-current.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-def-current.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS (rolling update)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test deployment
        run: |
          # Poll /api/health until it returns 200 (models fully warmed up).
          # Gives up to 3 minutes — warmup is ~20-60s after ECS stability.
          MAX_WAIT=180
          INTERVAL=15
          ELAPSED=0
          echo "Waiting for /api/health to return 200..."
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.letatec.com/api/health" \
              --max-time 20)
            echo "  [${ELAPSED}s] status=${HTTP_STATUS}"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed — deployment complete."
              exit 0
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "ERROR: /api/health did not return 200 within ${MAX_WAIT}s"
          exit 1
