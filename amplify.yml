version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - node --version
            - npm install
        build:
          commands:
            - npm run build
            - echo "=== dist contents ===" && ls -la dist/
            - echo "=== dist/assets ===" && ls -la dist/assets/ | head -10
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
