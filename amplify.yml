version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - node --version
            - npm ci --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        # Vite stamps JS/CSS chunks with content hashes — safe to cache for 1 year.
        # Browsers re-fetch only when the hash (and therefore the content) changes.
        - pattern: 'assets/**.js'
          headers:
            - key: Cache-Control
              value: public, max-age=31536000, immutable
        - pattern: 'assets/**.css'
          headers:
            - key: Cache-Control
              value: public, max-age=31536000, immutable
        # Other static assets (images, woff2 fonts)
        - pattern: 'assets/**'
          headers:
            - key: Cache-Control
              value: public, max-age=2592000
        # index.html must never be cached — it is the entry point that
        # references the hashed chunks; stale index = wrong chunk filenames.
        - pattern: 'index.html'
          headers:
            - key: Cache-Control
              value: no-cache, no-store, must-revalidate
            - key: Pragma
              value: no-cache
        # Security headers on all responses
        - pattern: '**/*'
          headers:
            - key: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains; preload
            - key: X-Content-Type-Options
              value: nosniff
            - key: X-Frame-Options
              value: DENY
            - key: X-XSS-Protection
              value: 1; mode=block
            - key: Referrer-Policy
              value: strict-origin-when-cross-origin
            - key: Permissions-Policy
              value: geolocation=(), camera=(), microphone=(), payment=(), usb=()
            - key: Content-Security-Policy
              value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://unpkg.com https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.letatec.com https://*.s3.amazonaws.com https://*.s3.ap-south-1.amazonaws.com https://*.razorpay.com wss:; worker-src blob: https://unpkg.com; frame-src 'self' blob: https://api.letatec.com https://checkout.razorpay.com https://api.razorpay.com https://*.s3.amazonaws.com https://*.s3.ap-south-1.amazonaws.com; frame-ancestors 'none';"
