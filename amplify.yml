version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - node --version
            - npm install
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains; preload
            - key: X-Content-Type-Options
              value: nosniff
            - key: X-Frame-Options
              value: DENY
            - key: X-XSS-Protection
              value: 1; mode=block
            - key: Referrer-Policy
              value: strict-origin-when-cross-origin
            - key: Permissions-Policy
              value: geolocation=(), camera=(), microphone=(), payment=(), usb=()
            - key: Content-Security-Policy
              value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://unpkg.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://swmgzifq69.execute-api.ap-south-1.amazonaws.com https://*.s3.amazonaws.com https://*.s3.ap-south-1.amazonaws.com wss:; worker-src blob: https://unpkg.com; frame-src 'self' blob: https://swmgzifq69.execute-api.ap-south-1.amazonaws.com https://*.s3.amazonaws.com https://*.s3.ap-south-1.amazonaws.com; frame-ancestors 'none';"
            - key: Cache-Control
              value: no-store
