services:
  - type: web
    name: leta-rag-backend
    runtime: docker
    rootDir: rag-backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      # ── LLM ──────────────────────────────────────────────────────────────────
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MAIN_MODEL
        value: claude-sonnet-4-6
      - key: CLAUDE_UTILITY_MODEL
        value: claude-haiku-4-5-20251001
      - key: CLAUDE_THINKING_BUDGET
        value: "500"
      - key: CLAUDE_MAX_TOKENS
        value: "4000"

      # ── Embedding ─────────────────────────────────────────────────────────────
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL
        value: BAAI/bge-large-en-v1.5

      # ── Database ──────────────────────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: leta_history

      # ── Security ──────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_MASTER_SECRET
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

      # ── CORS ──────────────────────────────────────────────────────────────────
      - key: ALLOWED_ORIGINS
        value: https://gst-rag-95li.vercel.app,https://gst-rag.vercel.app,https://gst-rag-95li-git-main-samaksh-mathurs-projects.vercel.app

      # ── Server ────────────────────────────────────────────────────────────────
      - key: PORT
        value: "8080"
      - key: WORKERS
        value: "1"
      - key: ENVIRONMENT
        value: production

      # ── Cache (optional — falls back to DiskCache if not set) ─────────────────
      - key: REDIS_URL
        sync: false

      # ── Retrieval tuning ──────────────────────────────────────────────────────
      - key: VECTOR_SEARCH_TOP_K
        value: "50"
      - key: BM25_TOP_K
        value: "30"
      - key: SONNET_THINKING_THRESHOLD
        value: "1.1"
