services:
  - type: web
    name: leta-rag-backend
    runtime: docker
    rootDir: rag-backend
    dockerfilePath: ./Dockerfile
    envVars:
      # --- LLM ---
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      # --- Database ---
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: leta_history
      # --- Security ---
      - key: SECRET_KEY
        sync: false
      # --- CORS: set to your Vercel frontend URL ---
      - key: ALLOWED_ORIGINS
        sync: false
      # --- Misc ---
      - key: EMBEDDING_PROVIDER
        value: local
      - key: ENV
        value: production
