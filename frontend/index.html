<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect to Google Fonts origin so the DNS + TLS are resolved early -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Non-blocking font load: media="print" tricks the browser into downloading
         without blocking render; onload swaps it to 'all' once available.
         The <noscript> fallback covers browsers with JS disabled. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@500;600;700;800&display=swap"
      >
    </noscript>

    <!-- The actual LETA TEC logo — same asset used in Navbar/LetaWorkspace's
         header. Was a placeholder "L" monogram SVG before this; that was
         never swapped out for the real mark. -->
    <link rel="icon" type="image/png" href="/LETA_WHITE_ON_BLACK_4K.png" />

    <!-- Razorpay Standard Web Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <title>LETA TEC</title>
  </head>
  <body style="background-color:#060816">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
