name: Deploy to ECS (Rolling)

on:
  push:
    branches: [main]
    paths:
      - "RAG/rag-backend/**"
      - ".github/workflows/deploy-ecs.yml"

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: gst-rag-backend
  ECS_CLUSTER: gst-rag-cluster1
  ECS_SERVICE: gst-rag-service
  CONTAINER_NAME: gst-rag-backend
  TASK_DEFINITION_FILE: RAG/rag-backend/.aws/task-definition.json

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. AWS credentials ───────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 3. Login to ECR ──────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Build, tag & push Docker image ────────────────────────────────────
      - name: Build, tag, and push image to ECR
        id: build-image
        working-directory: RAG/rag-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build \
            --cache-from $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ── 5. Inject secrets from AWS SSM into task definition ──────────────────
      # We store secrets in SSM Parameter Store and substitute the PLACEHOLDER
      # values at deploy time — secrets never live in the repo or task JSON.
      - name: Substitute secrets into task definition
        id: inject-secrets
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          ANTHROPIC_KEY=$(aws ssm get-parameter \
            --name "/leta/ANTHROPIC_API_KEY" --with-decryption \
            --query "Parameter.Value" --output text)
          MONGO_URI=$(aws ssm get-parameter \
            --name "/leta/MONGODB_URI" --with-decryption \
            --query "Parameter.Value" --output text)
          SECRET_KEY=$(aws ssm get-parameter \
            --name "/leta/SECRET_KEY" --with-decryption \
            --query "Parameter.Value" --output text)
          ADMIN_SECRET=$(aws ssm get-parameter \
            --name "/leta/ADMIN_MASTER_SECRET" --with-decryption \
            --query "Parameter.Value" --output text)
          REDIS_URL=$(aws ssm get-parameter \
            --name "/leta/REDIS_URL" --with-decryption \
            --query "Parameter.Value" --output text)

          # Substitute all PLACEHOLDER values and update image tag
          sed \
            -e "s|PLACEHOLDER_ANTHROPIC|$ANTHROPIC_KEY|g" \
            -e "s|PLACEHOLDER_MONGO|$MONGO_URI|g" \
            -e "s|PLACEHOLDER_SECRET|$SECRET_KEY|g" \
            -e "s|PLACEHOLDER_ADMIN|$ADMIN_SECRET|g" \
            -e "s|PLACEHOLDER_REDIS|$REDIS_URL|g" \
            -e "s|:latest|:$IMAGE_TAG|g" \
            ${{ env.TASK_DEFINITION_FILE }} > /tmp/task-definition-final.json

          echo "task_def=/tmp/task-definition-final.json" >> $GITHUB_OUTPUT

      # ── 6. Register new task definition revision ─────────────────────────────
      - name: Register new ECS task definition
        id: register-task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.inject-secrets.outputs.task_def }} \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      # ── 7. Rolling deploy — new task starts before old one stops ─────────────
      # minimum-healthy-percent=100 means ECS brings up the new task fully
      # before draining the old one → zero downtime.
      # If the new task fails health checks, the deployment stops and the old
      # task keeps serving traffic (automatic rollback).
      - name: Deploy to ECS service (rolling update)
        run: |
          aws ecs update-service \
            --cluster  ${{ env.ECS_CLUSTER }} \
            --service  ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task.outputs.task_def_arn }} \
            --desired-count 2 \
            --deployment-configuration \
              "minimumHealthyPercent=100,maximumPercent=200" \
            --force-new-deployment

      # ── 8. Wait for stability (fails CI if deploy is unhealthy) ──────────────
      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          echo "Deployment stable — ${{ github.sha }} is live."
