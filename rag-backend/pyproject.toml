[project]
name = "rag-backend"
version = "0.1.0"
description = "GST and Legal Intelligence Engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.13.2",
    "fastapi>=0.128.0",
    "opencv-python>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "pdf2image>=1.17.0",
    "pymupdf>=1.26.7",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "uvicorn>=0.40.0",
    "pymongo>=4.6.0",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "slowapi>=0.1.9",
    "tenacity>=8.2.0",
    "boto3>=1.30.0",
    "openai>=1.10.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "markdown2>=2.4.13",
    "flashrank>=0.2.0",
    "diskcache>=5.6.0",
    "reportlab>=4.1.0",
    "rank-bm25>=0.2.2",
    "PyJWT>=2.8.0",
    "fuzzywuzzy>=0.18.0",
    "ftfy>=6.1.1",
    "psutil>=5.9.0",
    "anthropic>=0.122.0",
    "redis>=8.1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.15.0"]
razorpay = ["razorpay>=1.4.1"]
redis = ["redis>=5.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
